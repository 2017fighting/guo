<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · 红果 Web</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="topnav">
  <div class="container topnav-inner">
    <a href="browse.html" class="brand">红果鉴·Web</a>
    <nav class="navtabs" aria-label="主导航">
      <a class="navtab" href="browse.html">浏览</a>
      <a class="navtab" href="#" title="等排行榜接口抓包后上线">排行榜<sup class="badge badge-outline" style="margin-left:4px">待抓包</sup></a>
      <a class="navtab" href="downloads.html">下载队列</a>
    </nav>
    <div class="flex-1"></div>
    <button class="btn btn-outline btn-icon theme-toggle" onclick="guoToggleTheme()" aria-label="切换深浅主题">🌓</button>
  </div>
</header>

<main class="container mt-4" style="max-width: 900px">
  <!-- 搜索框 + 联想（输入停顿 300ms 出联想，最多 10 条） -->
  <div class="relative mb-2">
    <label class="sr-only" for="q">搜索剧名</label>
    <input id="q" class="input" style="padding-left:40px" placeholder="搜索剧名、演员…" value="白月光" autocomplete="off">
    <span class="absolute" style="left:12px;top:50%;transform:translateY(-50%)" aria-hidden="true">🔍</span>
    <button class="btn btn-primary" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px" onclick="alert('原型：执行搜索')">搜索</button>
  </div>
  <div class="card mb-4" id="suggest" style="padding:4px 0">
    <button class="btn btn-sm btn-secondary w-full" style="justify-content:flex-start;border-radius:8px">宴律，你的<strong>白月光</strong>回国了 · 剧名</button>
    <button class="btn btn-sm btn-secondary w-full" style="justify-content:flex-start;border-radius:8px">穿书后我成了反派的<strong>白月光</strong> · 剧名</button>
    <button class="btn btn-sm btn-secondary w-full" style="justify-content:flex-start;border-radius:8px"><strong>白月光</strong>题材 · 分类</button>
  </div>

  <div class="flex items-center gap-2 mb-4">
    <span class="muted text-sm">最近搜索</span>
    <span class="flex gap-2" style="flex-wrap:wrap">
      <button class="badge badge-outline" style="min-height:32px">宴律</button>
      <button class="badge badge-outline" style="min-height:32px">首辅娇娘</button>
      <button class="badge badge-outline" style="min-height:32px">逆袭</button>
      <button class="btn btn-sm" style="color:var(--muted-foreground)">清除</button>
    </span>
  </div>

  <h2 class="text-lg font-semibold mb-4">搜索结果 <span class="muted text-sm">共 23 部</span></h2>
  <div class="poster-grid">
    <a class="poster-card" href="detail.html">
      <div class="poster-cover tone-1">宴律，你的白月光回国了</div>
      <div class="poster-meta">
        <div class="poster-title">宴律，你的白月光回国了</div>
        <div class="poster-sub"><span>76 集</span><span>·</span><span>完结</span><span>·</span><span>1.2亿热度</span></div>
      </div>
    </a>
    <a class="poster-card" href="detail.html">
      <div class="poster-cover tone-2">穿书后我成了反派的白月光</div>
      <div class="poster-meta">
        <div class="poster-title">穿书后我成了反派的白月光</div>
        <div class="poster-sub"><span>AI 剧</span><span>·</span><span>80 集</span><span>·</span><span>完结</span></div>
      </div>
    </a>
    <a class="poster-card" href="detail.html">
      <div class="poster-cover tone-1">白月光她不装了</div>
      <div class="poster-meta">
        <div class="poster-title">白月光她不装了</div>
        <div class="poster-sub"><span>56 集</span><span>·</span><span>连载</span><span>·</span><span>2100万热度</span></div>
      </div>
    </a>
    <a class="poster-card" href="detail.html">
      <div class="poster-cover tone-2">重生后我抢了白月光的剧本</div>
      <div class="poster-meta">
        <div class="poster-title">重生后我抢了白月光的剧本</div>
        <div class="poster-sub"><span>44 集</span><span>·</span><span>完结</span></div>
      </div>
    </a>
  </div>
  <div class="load-more"><button class="btn btn-outline">加载更多</button></div>
</main>

<nav class="tabbar" aria-label="底部导航">
  <a class="tabbar-item" href="browse.html"><span>□</span>浏览</a>
  <a class="tabbar-item" href="search.html" aria-current="page"><span>🔍</span>搜索</a>
  <a class="tabbar-item" href="downloads.html"><span>↓</span>下载</a>
</nav>
<script src="app.js"></script>
</body>
</html>
