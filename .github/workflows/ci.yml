# 日常 CI 门禁：两次发布标签之间也有 go vet + go test 兜底（lean，不装 node）。
name: ci
on:
  push:
    branches: [main, spec/v1]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # 按 go.sum 缓存模块
      - run: go vet ./...
      - run: go test ./...
