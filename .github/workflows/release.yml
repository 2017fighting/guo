# 发布：push v* 标签 → 先跑测试门禁，再 buildx 多架构镜像推 ghcr.io/2017fighting/guo。
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # 门禁：测试不过不出镜像；同时预构建 web，TS 错误在 push 前暴露
    # （镜像内 Dockerfile 自建前端，这里只做门禁拦截）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 10 # 兼容 lockfileVersion 9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN 推 ghcr
    steps:
      - uses: actions/checkout@v5
      # arm64 经 QEMU 仿真构建（纯 alpine 多架构基础镜像，无交叉编译坑；
      # 若仿真构建不稳，去掉 arm64 只保留 amd64 即可）
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/2017fighting/guo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
